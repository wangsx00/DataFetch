name: Daily Douban Data Sync

on:
  schedule:
    # 每天北京时间 00:00 执行 (UTC 16:00)
    - cron: '0 16 * * *'
  workflow_dispatch: # 允许手动触发执行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予提交代码的权限
    env:
      DOUBAN_COOKIE: ${{ secrets.DOUBAN_COOKIE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: gemini
      AI_VISION_MODEL: gemini-3.6-flash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup FFmpeg
        uses: federicocarboni/setup-ffmpeg@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 || true
          sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64 || true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tvDataFetch/requirements.txt

      - name: Install Node Dependencies (puppeteer)
        working-directory: ./tvDataFetch
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Log Environment
        run: |
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Runner OS: $RUNNER_OS"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Python version: $(python3 --version)"
          if [ -n "$DOUBAN_COOKIE" ]; then
            echo "DOUBAN_COOKIE: configured"
          else
            echo "DOUBAN_COOKIE: not configured"
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY: configured"
          else
            echo "GEMINI_API_KEY: not configured"
          fi
          echo "Repository root:"
          ls -la
          echo "tvDataFetch directory:"
          ls -la tvDataFetch

      - name: Run Sync Script
        working-directory: ./tvDataFetch
        run: |
          echo "Working directory: $(pwd)"
          echo "Starting sync script..."
          node douban_sync_hot.js
          # node douban_sync_hot.js --no-cache
          echo "Sync script finished"

      - name: Log Output Summary
        if: always()
        working-directory: ./tvDataFetch
        run: |
          echo "douban_hot_json status:"
          ls -lah douban_hot_json || true
          echo "douban_hot_json preview:"
          head -c 2000 douban_hot_json || true

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 1. 提交数据 JSON 变更到主分支
          git add tvDataFetch/douban_hot_json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update douban hot data"
            git push
          fi

          # 2. 强制覆盖更新 assets 孤儿分支
          # 将生成的视频和图片资源推送到专门的资源分支
          if [ -d "tvDataFetch/assets" ]; then
            echo "正在同步资源到 assets 分支..."
            cd tvDataFetch/assets
            git init
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add .
            git commit -m "deploy: update static assets [skip ci]"
            git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:assets
          else
            echo "未找到 assets 目录，跳过资源同步。"
          fi
